spring.application.name=coreservices

# PostgreSQL — create empty database "dbms" in pgAdmin first; tables via JPA ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/dbms
# In pgAdmin use this same database name (dbms), not mth
spring.datasource.username=postgres
spring.datasource.password=Joohi08

# JPA (tables + seed still run; SQL is not printed to console)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

server.port=8080

# JWT
app.jwt.secret=change-this-secret-key-to-at-least-32-characters-long
app.jwt.expiration-ms=86400000